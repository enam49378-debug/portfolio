<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¿Puedes donar tu alma?</title>
  <link rel="icon" type="image/png" href="Imagenes/icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      color: #fff;
      font-family: 'Press Start 2P', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      gap: 24px;
      overflow-x: hidden;
    }

    /* ── SOUL HEART (big, asset) ── */
    .soul {
      width: 44px;
      height: 44px;
      image-rendering: pixelated;
      animation: soulBounce 1.2s ease-in-out infinite;
      flex-shrink: 0;
    }

    @keyframes soulBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }

    /* ── SOUL HEART (small inline, asset) ── */
    .ph {
      width: 14px;
      height: 14px;
      image-rendering: pixelated;
      vertical-align: middle;
      margin-right: 10px;
      flex-shrink: 0;
    }

    /* ── TITLE ── */
    h1 {
      font-size: clamp(0.9rem, 3vw, 1.5rem);
      line-height: 1.9;
      text-align: center;
      letter-spacing: 0.05em;
    }

    .subtitle {
      font-size: 0.4rem;
      line-height: 2.1;
      color: #888;
      text-align: center;
    }

    /* ── PANEL ── */
    .panel {
      border: 2px solid #fff;
      display: flex;
      width: min(860px, 92vw);
      flex: 1 1 auto;
      max-height: 460px;
      min-height: 320px;
    }

    .col-left {
      width: 40%;
      border-right: 2px solid #fff;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }

    .col-right {
      width: 60%;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }

    .col-title {
      font-size: 0.5rem;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      white-space: nowrap;
    }

    /* ── DROPZONE ── */
    .dropzone {
      flex: 1;
      border: 2px dashed #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: border-color 200ms, box-shadow 200ms;
      position: relative;
      overflow: hidden;
      min-height: 100px;
    }

    .dropzone:hover,
    .dropzone.dragover {
      border-color: #FF0033;
      box-shadow: 0 0 16px rgba(255, 0, 51, 0.25);
    }

    .dropzone::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 110px;
      height: 110px;
      transform: translate(-50%, -50%);
      background: url('Games/Under/Asset/Soul/Undertale_red_soul.png') center / contain no-repeat;
      opacity: 0.06;
      image-rendering: pixelated;
      pointer-events: none;
      z-index: 0;
    }

    .dropzone-content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .dropzone-icon {
      font-size: 1.4rem;
      margin-bottom: 14px;
      color: #fff;
    }

    .dropzone-text {
      font-size: 0.38rem;
      line-height: 2.2;
      text-align: center;
      color: #777;
    }

    .dropzone img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      position: absolute;
      top: 0;
      left: 0;
      padding: 10px;
      image-rendering: pixelated;
    }

    /* ── MODEL LABEL ── */
    .model-label {
      font-size: 0.38rem;
      color: #777;
      margin-bottom: 12px;
    }

    /* ── MODEL BUTTONS ── */
    .model-btns {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .model-btn {
      flex: 1;
      padding: 10px 8px;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.45rem;
      border: 2px solid transparent;
      background: #222;
      color: #666;
      cursor: pointer;
      transition: all 150ms;
      text-align: center;
    }

    .model-btn.active {
      border-color: #fff;
      background: #000;
      color: #fff;
    }

    .model-btn.active::before {
      content: '';
      display: inline-block;
      width: 11px;
      height: 11px;
      margin-right: 6px;
      background: url('Games/Under/Asset/Soul/Undertale_red_soul.png') center / contain no-repeat;
      image-rendering: pixelated;
      vertical-align: middle;
      animation: soulBounce 1.2s ease-in-out infinite;
    }

    .model-btn:hover:not(.active) {
      background: #333;
      color: #aaa;
    }

    /* ── VIEWER ── */
    .viewer {
      flex: 1;
      background: #000;
      min-height: 180px;
      position: relative;
      overflow: hidden;
    }

    .viewer canvas {
      display: block;
    }

    /* ── CONTINUE BUTTON ── */
    .continue-btn {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.55rem;
      padding: 14px 40px;
      background: #000;
      color: #fff;
      border: 2px solid #fff;
      cursor: pointer;
      transition: all 150ms;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 4px;
    }

    .continue-btn:hover {
      border-color: #FF0033;
    }

    .continue-btn .btn-heart {
      width: 15px;
      height: 15px;
      image-rendering: pixelated;
      flex-shrink: 0;
    }

    .continue-btn:disabled {
      border-color: #333;
      color: #333;
      cursor: not-allowed;
    }
    .continue-btn:disabled .btn-heart {
      opacity: 0.25;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 768px) {
      body { padding: 24px 16px; gap: 18px; }
      .panel {
        flex-direction: column;
        max-height: none;
        min-height: auto;
        height: auto;
      }
      .col-left {
        width: 100%;
        border-right: none;
        border-bottom: 2px solid #fff;
        min-height: 200px;
      }
      .col-right {
        width: 100%;
        min-height: 300px;
      }
      .viewer { min-height: 220px; }
    }
  </style>
</head>
<body>

  <!-- ── HEART ── -->
  <img class="soul" src="Games/Under/Asset/Soul/Undertale_red_soul.png" alt="">

  <!-- ── TITLE ── -->
  <h1>¿Puedes donar<br>tu alma?</h1>
  <p class="subtitle">"Para una mejor experiencia,<br>por favor sube tu skin de Minecraft."</p>

  <!-- ── MAIN PANEL ── -->
  <div class="panel">

    <!-- COLUMNA IZQUIERDA: UPLOAD -->
    <div class="col-left">
      <div class="col-title"><img class="ph" src="Games/Under/Asset/Soul/Undertale_red_soul.png" alt=""> SUBE TU SKIN</div>
      <div class="dropzone" id="dropzone">
        <input type="file" id="fileInput" accept="image/*" hidden>
        <div class="dropzone-content" id="dropzoneContent">
          <div class="dropzone-icon">&#9650;</div>
          <div class="dropzone-text">Arrastra o selecciona<br>tu archivo .png</div>
        </div>
        <img id="previewImg" hidden alt="Skin">
      </div>
    </div>

    <!-- COLUMNA DERECHA: PREVIEW + MODELO 3D -->
    <div class="col-right">
      <div class="col-title"><img class="ph" src="Games/Under/Asset/Soul/Undertale_red_soul.png" alt=""> VISTA PREVIA</div>
      <p class="model-label">Selecciona tu modelo</p>
      <div class="model-btns">
        <button class="model-btn active" data-skin="steve">STEVE</button>
        <button class="model-btn" data-skin="alex">ALEX</button>
      </div>
      <div class="viewer" id="viewer"></div>
    </div>

  </div>

  <!-- ── CONTINUAR ── -->
  <button class="continue-btn" id="continueBtn" disabled>
    <img class="btn-heart" src="Games/Under/Asset/Soul/Undertale_red_soul.png" alt=""> CONTINUAR
  </button>

  <!-- Three.js -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/controls/OrbitControls.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const dropzone      = document.getElementById('dropzone');
      const fileInput     = document.getElementById('fileInput');
      const dropContent   = document.getElementById('dropzoneContent');
      const previewImg    = document.getElementById('previewImg');
      const viewer        = document.getElementById('viewer');
      const continueBtn   = document.getElementById('continueBtn');
      const modelBtns     = document.querySelectorAll('.model-btn');

      let selectedSkin = 'steve';
      let uploadedImage = null;
      let scene, camera, renderer, controls;
      let modelRoot = null;
      let activeTexture = null;
      let texW = 64, texH = 64;
      let modelToken = 0;

      const MODEL_URLS = {
        steve: 'Personajes/Undertale/Steve.bbs.json',
        alex:  'Personajes/Undertale/Alex.bbs.json'
      };

      // BoxGeometry face order in three.js: px, nx, py, ny, pz, nz
      const FACE_KEYS = ['right', 'left', 'top', 'bottom', 'front', 'back'];

      const SKIN_URLS = {
        steve: 'Personajes/Undertale/steve.png',
        alex:  'Personajes/Undertale/alex.png'
      };

      function configureTexture(tex) {
        tex.flipY = false;
        tex.magFilter = THREE.NearestFilter;
        tex.minFilter = THREE.NearestFilter;
        tex.generateMipmaps = false;
        tex.encoding = THREE.sRGBEncoding;
        return tex;
      }

      // ═══════ TEXTURE ═══════
      function getTexture() {
        return new Promise(resolve => {
          const url = uploadedImage || SKIN_URLS[selectedSkin];
          const tex = new THREE.TextureLoader().load(url, () => {
            configureTexture(tex);
            const img = tex.image;
            if (img) { texW = img.width || 64; texH = img.height || 64; }
            resolve(tex);
          });
        });
      }

      // ═══════ MODEL BUILDER (Blockbench JSON) ═══════
      function buildBox(cube, tex) {
        const [sx, sy, sz] = cube.size;
        const geo = new THREE.BoxGeometry(sx, sy, sz);
        const uvs = cube.uvs;
        if (uvs) {
          const uvAttr = geo.attributes.uv;
          for (let i = 0; i < 6; i++) {
            const r = uvs[FACE_KEYS[i]];
            if (!r) continue;
            const [u0, v0, u1, v1] = r;
            const o = i * 4;
            uvAttr.setXY(o + 0, u0 / texW, v0 / texH);
            uvAttr.setXY(o + 1, u1 / texW, v0 / texH);
            uvAttr.setXY(o + 2, u0 / texW, v1 / texH);
            uvAttr.setXY(o + 3, u1 / texW, v1 / texH);
          }
          uvAttr.needsUpdate = true;
        }
        const isOverlay = !!cube.offset;
        const mat = new THREE.MeshPhongMaterial({
          map: tex,
          shininess: 20,
          transparent: isOverlay,
          depthWrite: !isOverlay
        });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.renderOrder = isOverlay ? 1 : 0;
        mesh.position.set(
          cube.from[0] + sx / 2,
          cube.from[1] + sy / 2,
          cube.from[2] + sz / 2
        );
        if (cube.offset) mesh.scale.set(1.03, 1.03, 1.03);
        return mesh;
      }

      function buildModel(json, tex) {
        const root = new THREE.Group();
        const groups = json.model.groups;
        Object.keys(groups).forEach(name => {
          const g = groups[name];
          if (!g.cubes) return;
          g.cubes.forEach(cube => root.add(buildBox(cube, tex)));
        });
        root.scale.set(1 / 16, 1 / 16, 1 / 16);
        return root;
      }

      function buildFallback(tex) {
        const root = new THREE.Group();
        const geo = new THREE.BoxGeometry(16, 32, 8);
        const mesh = new THREE.Mesh(geo, new THREE.MeshPhongMaterial({ map: tex, shininess: 20 }));
        mesh.position.y = 16;
        root.add(mesh);
        root.scale.set(1 / 16, 1 / 16, 1 / 16);
        return root;
      }

      function clearModel() {
        if (!modelRoot) return;
        scene.remove(modelRoot);
        modelRoot.traverse(obj => {
          if (obj.geometry) obj.geometry.dispose();
          if (obj.material) {
            if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
            else obj.material.dispose();
          }
        });
        modelRoot = null;
      }

      // ═══════ Three.js ═══════
      function initThree() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);

        const w = viewer.clientWidth || 1;
        const h = viewer.clientHeight || 1;
        camera = new THREE.PerspectiveCamera(50, w / h, 0.1, 1000);
        camera.position.set(0, 1.5, 3.4);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(w, h);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.outputEncoding = THREE.sRGBEncoding;
        viewer.appendChild(renderer.domElement);

        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.enablePan = false;
        controls.target.set(0, 1, 0);
        controls.minDistance = 0.8;
        controls.maxDistance = 8;

        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const dir = new THREE.DirectionalLight(0xffffff, 0.9);
        dir.position.set(3, 5, 2);
        scene.add(dir);
        const rim = new THREE.DirectionalLight(0xffffff, 0.35);
        rim.position.set(-2, 2, -3);
        scene.add(rim);

        updateModel();

        (function loop() {
          requestAnimationFrame(loop);
          if (modelRoot) modelRoot.rotation.y += 0.005;
          controls.update();
          renderer.render(scene, camera);
        })();
      }

      function frameCamera(root) {
        const box = new THREE.Box3().setFromObject(root);
        const sphere = box.getBoundingSphere(new THREE.Sphere());
        const center = sphere.center;
        const dist = sphere.radius / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
        controls.target.copy(center);
        const dir = new THREE.Vector3(0.45, 0.25, 1).normalize();
        camera.position.copy(center).add(dir.multiplyScalar(dist * 1.2));
        controls.minDistance = sphere.radius * 0.8;
        controls.maxDistance = sphere.radius * 6;
        controls.update();
      }

      function updateModel() {
        const token = ++modelToken;
        getTexture().then(tex => {
          if (token !== modelToken) return;
          fetch(MODEL_URLS[selectedSkin])
            .then(r => { if (!r.ok) throw new Error('http'); return r.json(); })
            .then(json => {
              if (token !== modelToken) return;
              clearModel();
              modelRoot = buildModel(json, tex);
              scene.add(modelRoot);
              frameCamera(modelRoot);
              if (activeTexture && activeTexture !== tex) activeTexture.dispose();
              activeTexture = tex;
            })
            .catch(() => {
              if (token !== modelToken) return;
              clearModel();
              modelRoot = buildFallback(tex);
              scene.add(modelRoot);
              frameCamera(modelRoot);
              if (activeTexture && activeTexture !== tex) activeTexture.dispose();
              activeTexture = tex;
            });
        });
      }

      function onResize() {
        if (!camera || !renderer) return;
        const w = viewer.clientWidth || 1;
        const h = viewer.clientHeight || 1;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
      }

      // ═══════ FILE UPLOAD ═══════
      function handleFile(file) {
        if (!file || !file.type.match('image.*')) return;
        const reader = new FileReader();
        reader.onload = ev => {
          uploadedImage = ev.target.result;
          previewImg.src = uploadedImage;
          previewImg.hidden = false;
          dropContent.style.display = 'none';
          updateModel();
          continueBtn.disabled = false;
        };
        reader.readAsDataURL(file);
      }

      dropzone.addEventListener('click', () => fileInput.click());
      fileInput.addEventListener('change', e => handleFile(e.target.files[0]));

      dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('dragover'); });
      dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
      dropzone.addEventListener('drop', e => {
        e.preventDefault();
        dropzone.classList.remove('dragover');
        handleFile(e.dataTransfer.files[0]);
      });

      // ═══════ MODEL SELECTION ═══════
      modelBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          modelBtns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          selectedSkin = btn.dataset.skin;
          updateModel();
        });
      });

      // ═══════ CONTINUE ═══════
      continueBtn.addEventListener('click', () => {
        if (!uploadedImage) return;
        alert('¡El viaje comienza!');
      });

      // ═══════ RESIZE ═══════
      window.addEventListener('resize', onResize);

      initThree();
    });
  </script>
</body>
</html>
