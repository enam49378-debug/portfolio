<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¿Puedes donar tu alma?</title>
  <link rel="icon" type="image/png" href="Imagenes/icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      color: #fff;
      font-family: 'Press Start 2P', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      gap: 24px;
      overflow-x: hidden;
    }

    /* ── PIXEL HEART (big) ── */
    .soul {
      width: 22px;
      height: 22px;
      background: #FF0033;
      transform: rotate(-45deg);
      position: relative;
      animation: soulBounce 1.2s ease-in-out infinite;
      flex-shrink: 0;
    }
    .soul::before, .soul::after {
      content: '';
      position: absolute;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #FF0033;
    }
    .soul::before { top: -11px; left: 0; }
    .soul::after { top: 0; left: 11px; }

    @keyframes soulBounce {
      0%, 100% { transform: rotate(-45deg) translateY(0); }
      50% { transform: rotate(-45deg) translateY(-6px); }
    }

    /* ── PIXEL HEART (small inline) ── */
    .ph {
      display: inline-block;
      width: 10px;
      height: 10px;
      background: #FF0033;
      transform: rotate(-45deg);
      position: relative;
      vertical-align: middle;
      margin-right: 8px;
      flex-shrink: 0;
    }
    .ph::before, .ph::after {
      content: '';
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #FF0033;
    }
    .ph::before { top: -5px; left: 0; }
    .ph::after { top: 0; left: 5px; }

    /* ── TITLE ── */
    h1 {
      font-size: clamp(0.9rem, 3vw, 1.5rem);
      line-height: 1.9;
      text-align: center;
      letter-spacing: 0.05em;
    }

    .subtitle {
      font-size: 0.4rem;
      line-height: 2.1;
      color: #888;
      text-align: center;
    }

    /* ── PANEL ── */
    .panel {
      border: 2px solid #fff;
      display: flex;
      width: min(860px, 92vw);
      flex: 1 1 auto;
      max-height: 460px;
      min-height: 320px;
    }

    .col-left {
      width: 40%;
      border-right: 2px solid #fff;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }

    .col-right {
      width: 60%;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }

    .col-title {
      font-size: 0.5rem;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      white-space: nowrap;
    }

    /* ── DROPZONE ── */
    .dropzone {
      flex: 1;
      border: 2px dashed #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: border-color 200ms, box-shadow 200ms;
      position: relative;
      overflow: hidden;
      min-height: 100px;
    }

    .dropzone:hover,
    .dropzone.dragover {
      border-color: #FF0033;
      box-shadow: 0 0 16px rgba(255, 0, 51, 0.25);
    }

    .dropzone-icon {
      font-size: 1.4rem;
      margin-bottom: 14px;
      color: #fff;
    }

    .dropzone-text {
      font-size: 0.38rem;
      line-height: 2.2;
      text-align: center;
      color: #777;
    }

    .dropzone img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      position: absolute;
      top: 0;
      left: 0;
      padding: 10px;
    }

    /* ── MODEL LABEL ── */
    .model-label {
      font-size: 0.38rem;
      color: #777;
      margin-bottom: 12px;
    }

    /* ── MODEL BUTTONS ── */
    .model-btns {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .model-btn {
      flex: 1;
      padding: 10px 8px;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.45rem;
      border: 2px solid transparent;
      background: #222;
      color: #666;
      cursor: pointer;
      transition: all 150ms;
      text-align: center;
    }

    .model-btn.active {
      border-color: #fff;
      background: #000;
      color: #fff;
    }

    .model-btn:hover:not(.active) {
      background: #333;
      color: #aaa;
    }

    /* ── VIEWER ── */
    .viewer {
      flex: 1;
      background: #000;
      min-height: 180px;
      position: relative;
      overflow: hidden;
    }

    .viewer canvas {
      display: block;
    }

    /* ── CONTINUE BUTTON ── */
    .continue-btn {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.55rem;
      padding: 14px 40px;
      background: #000;
      color: #fff;
      border: 2px solid #fff;
      cursor: pointer;
      transition: all 150ms;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 4px;
    }

    .continue-btn:hover {
      border-color: #FF0033;
    }

    .continue-btn .btn-heart {
      display: inline-block;
      width: 10px;
      height: 10px;
      background: #FF0033;
      transform: rotate(-45deg);
      position: relative;
      flex-shrink: 0;
    }
    .continue-btn .btn-heart::before,
    .continue-btn .btn-heart::after {
      content: '';
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #FF0033;
    }
    .continue-btn .btn-heart::before { top: -5px; left: 0; }
    .continue-btn .btn-heart::after { top: 0; left: 5px; }

    .continue-btn:disabled {
      border-color: #333;
      color: #333;
      cursor: not-allowed;
    }
    .continue-btn:disabled .btn-heart { background: #333; }
    .continue-btn:disabled .btn-heart::before,
    .continue-btn:disabled .btn-heart::after { background: #333; }

    /* ── RESPONSIVE ── */
    @media (max-width: 768px) {
      body { padding: 24px 16px; gap: 18px; }
      .panel {
        flex-direction: column;
        max-height: none;
        min-height: auto;
        height: auto;
      }
      .col-left {
        width: 100%;
        border-right: none;
        border-bottom: 2px solid #fff;
        min-height: 200px;
      }
      .col-right {
        width: 100%;
        min-height: 300px;
      }
      .viewer { min-height: 220px; }
    }
  </style>
</head>
<body>

  <!-- ── HEART ── -->
  <div class="soul"></div>

  <!-- ── TITLE ── -->
  <h1>¿Puedes donar<br>tu alma?</h1>
  <p class="subtitle">"Para una mejor experiencia,<br>por favor sube tu skin de Minecraft."</p>

  <!-- ── MAIN PANEL ── -->
  <div class="panel">

    <!-- COLUMNA IZQUIERDA: UPLOAD -->
    <div class="col-left">
      <div class="col-title"><span class="ph"></span> SUBE TU SKIN</div>
      <div class="dropzone" id="dropzone">
        <input type="file" id="fileInput" accept="image/*" hidden>
        <div class="dropzone-content" id="dropzoneContent">
          <div class="dropzone-icon">&#9650;</div>
          <div class="dropzone-text">Arrastra o selecciona<br>tu archivo .png</div>
        </div>
        <img id="previewImg" hidden alt="Skin">
      </div>
    </div>

    <!-- COLUMNA DERECHA: PREVIEW + MODELO 3D -->
    <div class="col-right">
      <div class="col-title"><span class="ph"></span> VISTA PREVIA</div>
      <p class="model-label">Selecciona tu modelo</p>
      <div class="model-btns">
        <button class="model-btn active" data-skin="steve">STEVE</button>
        <button class="model-btn" data-skin="alex">ALEX</button>
      </div>
      <div class="viewer" id="viewer"></div>
    </div>

  </div>

  <!-- ── CONTINUAR ── -->
  <button class="continue-btn" id="continueBtn" disabled>
    <span class="btn-heart"></span> CONTINUAR
  </button>

  <!-- Three.js -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/controls/OrbitControls.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const dropzone      = document.getElementById('dropzone');
      const fileInput     = document.getElementById('fileInput');
      const dropContent   = document.getElementById('dropzoneContent');
      const previewImg    = document.getElementById('previewImg');
      const viewer        = document.getElementById('viewer');
      const continueBtn   = document.getElementById('continueBtn');
      const modelBtns     = document.querySelectorAll('.model-btn');

      let selectedSkin = 'steve';
      let uploadedImage = null;
      let scene, camera, renderer, cube, controls;

      // ═══════ Three.js ═══════
      function initThree() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);

        const w = viewer.clientWidth || 1;
        const h = viewer.clientHeight || 1;
        camera = new THREE.PerspectiveCamera(50, w / h, 0.1, 1000);
        camera.position.set(3, 2, 4);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(w, h);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        viewer.appendChild(renderer.domElement);

        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.enablePan = false;
        controls.minDistance = 3;
        controls.maxDistance = 8;

        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const dir = new THREE.DirectionalLight(0xffffff, 0.8);
        dir.position.set(2, 3, 2);
        scene.add(dir);

        const geo = new THREE.BoxGeometry(1.5, 2.5, 1);
        const mat = new THREE.MeshPhongMaterial({ color: 0x6d28d9, shininess: 20 });
        cube = new THREE.Mesh(geo, mat);
        scene.add(cube);

        (function loop() {
          requestAnimationFrame(loop);
          cube.rotation.y += 0.004;
          controls.update();
          renderer.render(scene, camera);
        })();
      }

      function updateModel() {
        if (!cube) return;
        const color = selectedSkin === 'steve' ? 0x6d28d9 : 0xa855f7;
        if (uploadedImage) {
          const tex = new THREE.TextureLoader().load(uploadedImage);
          tex.colorSpace = THREE.SRGBColorSpace;
          cube.material = new THREE.MeshPhongMaterial({ map: tex, color, shininess: 20 });
        } else {
          cube.material = new THREE.MeshPhongMaterial({ color, shininess: 20 });
        }
      }

      function onResize() {
        if (!camera || !renderer) return;
        const w = viewer.clientWidth || 1;
        const h = viewer.clientHeight || 1;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
      }

      // ═══════ FILE UPLOAD ═══════
      function handleFile(file) {
        if (!file || !file.type.match('image.*')) return;
        const reader = new FileReader();
        reader.onload = ev => {
          uploadedImage = ev.target.result;
          previewImg.src = uploadedImage;
          previewImg.hidden = false;
          dropContent.style.display = 'none';
          updateModel();
          continueBtn.disabled = false;
        };
        reader.readAsDataURL(file);
      }

      dropzone.addEventListener('click', () => fileInput.click());
      fileInput.addEventListener('change', e => handleFile(e.target.files[0]));

      dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('dragover'); });
      dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
      dropzone.addEventListener('drop', e => {
        e.preventDefault();
        dropzone.classList.remove('dragover');
        handleFile(e.dataTransfer.files[0]);
      });

      // ═══════ MODEL SELECTION ═══════
      modelBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          modelBtns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          selectedSkin = btn.dataset.skin;
          updateModel();
        });
      });

      // ═══════ CONTINUE ═══════
      continueBtn.addEventListener('click', () => {
        if (!uploadedImage) return;
        alert('¡El viaje comienza!');
      });

      // ═══════ RESIZE ═══════
      window.addEventListener('resize', onResize);

      initThree();
    });
  </script>
</body>
</html>
